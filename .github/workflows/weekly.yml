name: weekly snapshot

on:
  schedule:
    - cron: "0 4 * * 6"        # Saturdays 04:00 UTC = 09:30 IST, after the week closes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false     # a half-written append is worse than a late run

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q certifi
      - name: Sector parity with the heatmap board
        # The taxonomy is FETCHED from nifty-heatmap-core, so a change there
        # lands here silently. Fail loudly instead -- the 2026-09-06 Android
        # parity incident happened because nothing tested this.
        run: python parity_check.py
      - name: Prove the parity checks can still fail
        # A green gate that cannot go red is not a gate. Check [5] was once
        # `"st.mean" in source` and would have passed on a comment; this
        # injects a violation per check and asserts each one catches it.
        run: python test_parity_negative.py

      - name: Capture latest trading day
        run: python update.py
      - name: Rebuild the hosted sheets and the PCR series
        # ORDER IS LOAD-BEARING, each step consumes the one above:
        #   build_sheet_json -> expiries.json, which backfill_pcr reads
        #   backfill_pcr     -> pcr_history.csv AND pcr_weekly.csv
        #   build_pcr_json   -> merges monthly PCR, rewrites sheet_data.json
        #   weekly_sheet     -> needs pcr_weekly.csv for its own PCR columns,
        #                       and sheet_data.json for the canonical sector
        #                       order that keeps the two views scrolling together
        # backfill_pcr only fetches dates its CSVs do not already cover -- two
        # per new expiry plus one per new week. Deriving PCR from data/bhav/
        # instead would re-download ~80 bhavcopies every run, that cache being
        # gitignored and a fresh runner empty.
        run: |
          python scripts/build_sheet_json.py
          python backfill_pcr.py
          python scripts/build_pcr_json.py
          python weekly_sheet.py

      - name: Commit if the series grew
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/weekly_snapshots.csv data/pcr_history.csv \
                     data/pcr_weekly.csv \
                     data/nse_industry_cache.csv \
                     sheet_data.json weekly_data.json expiries.json 'sheet_*.json'
          if git diff --cached --quiet; then
            echo "no change — nothing to commit"
          else
            git commit -m "weekly snapshot $(date -u +%F)"
            git push
          fi
