name: daily snapshot

on:
  schedule:
    # EVERY WEEKDAY, not Tuesdays. Three times, because one cron is not a
    # guarantee: the Tuesday schedule this replaced fired ZERO times -- it was
    # added 2026-09-26, missed 2026-09-29, and every run in the repo's history
    # is a manual dispatch. GitHub drops scheduled runs under load with no
    # notice and no retry, so the board sat on 2026-09-30 data for a week while
    # looking perfectly alive.
    #
    # The whole job is idempotent -- update.py no-ops on a date already
    # captured, backfill --extend no-ops unless an expiry completed, and the
    # rebuilds are deterministic -- so a duplicate run costs one bhavcopy
    # request and commits nothing. Three chances a night is far cheaper than
    # another silent week.
    #
    # Times: 20:00, 21:30 and 23:00 IST. The F&O bhavcopy this repo reads
    # publishes ~18:00-18:30 IST and the next session opens 09:15, so all three
    # sit inside the window with margin at both ends.
    - cron: "30 14 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false     # a half-written append is worse than a late run

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q certifi
      - name: Sector parity with the heatmap board
        # The taxonomy is FETCHED from nifty-heatmap-core, so a change there
        # lands here silently. Fail loudly instead -- the 2026-09-06 Android
        # parity incident happened because nothing tested this.
        run: python parity_check.py
      - name: Prove the parity checks can still fail
        # A green gate that cannot go red is not a gate. Check [5] was once
        # `"st.mean" in source` and would have passed on a comment; this
        # injects a violation per check and asserts each one catches it.
        run: python test_parity_negative.py

      - name: Capture latest trading day
        # Already daily-shaped and idempotent: it captures the LATEST TRADING
        # DAY, not "this week", and re-running for a captured date is a no-op.
        # It was only ever named weekly because it was only ever RUN weekly.
        # Running it daily turns weekly_snapshots.csv into a true daily series,
        # which is what makes the board move between expiries at all.
        run: python update.py
      - name: Extend the MONTHLY series if an expiry has completed
        # Without this the monthly sheet cannot advance at all. update.py only
        # appends weekly snapshots, and backfill.main() is a full rewrite nobody
        # runs on a schedule -- so the sheet sat frozen on the 2026-08-25 expiry
        # while the September roll completed on 2026-09-29, with the weekly view
        # updating beside it making the page look alive. --extend is append-only
        # and a no-op when nothing has completed.
        run: python backfill.py --extend
      - name: Rebuild the hosted sheets and the PCR series
        # ORDER IS LOAD-BEARING, each step consumes the one above:
        #   build_sheet_json -> expiries.json, which backfill_pcr reads
        #   backfill_pcr     -> pcr_history.csv AND pcr_weekly.csv
        #   build_pcr_json   -> merges monthly PCR, rewrites sheet_data.json
        #   weekly_sheet     -> needs pcr_weekly.csv for its own PCR columns,
        #                       and sheet_data.json for the canonical sector
        #                       order that keeps the two views scrolling together
        # backfill_pcr only fetches dates its CSVs do not already cover -- two
        # per new expiry plus one per new week. Deriving PCR from data/bhav/
        # instead would re-download ~80 bhavcopies every run, that cache being
        # gitignored and a fresh runner empty.
        run: |
          python scripts/build_sheet_json.py
          python backfill_pcr.py
          python scripts/build_pcr_json.py
          python weekly_sheet.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/rollover_history.csv data/weekly_snapshots.csv \
                     data/pcr_history.csv \
                     data/pcr_weekly.csv \
                     data/nse_industry_cache.csv \
                     sheet_data.json weekly_data.json expiries.json 'sheet_*.json'
          if git diff --cached --quiet; then
            echo "no change — nothing to commit"
          else
            git commit -m "daily snapshot $(date -u +%F)"
            git push
          fi
